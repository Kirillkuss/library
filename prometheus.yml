global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'library-app'
    metrics_path: 'library/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8094']
    # Добавляем лейблы для локального окружения
    relabel_configs:
      - target_label: environment
        replacement: 'local'
      - target_label: region
        replacement: 'dev'

  - job_name: 'lib-app-live'
    metrics_path: 'library/actuator/prometheus'
    scheme: 'https'
    static_configs:
      - targets: ['vh-prod-library-maven-8aaf8b-2b719cd9.livemy.site']
    # Добавляем лейблы для продакшена
    relabel_configs:
      - target_label: environment
        replacement: 'production'
      - target_label: region
        replacement: 'us-east'
      - target_label: instance  # Можно переопределить instance
        replacement: 'prod-library-app'

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]