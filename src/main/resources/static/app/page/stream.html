<!doctype html>
<html lang="ru">
<head>
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Трансляция</title>
    <link rel="stylesheet" href="/library/css/menu/index.css">
    <link rel="stylesheet" href="/library/css/video/video.css">
    <link rel="stylesheet" href="/library/css/video/stream.css">
    <script type = "text/javascript" src="/library/js/video/stream.js"></script>
</head>
<body>
    <div class="main-content">
        <div class="container-fluid">
            <div class="page-header mb-4">
                <h2><i class="fas fa-caret-square-right"></i> Трансляция </h2>
            </div>
            <div class="control-panel">
                <div class="control-section">
                    <div class="panel-title"><i class="fas fa-camera me-1"></i> Выбор камеры</div>
                    <div class="controls-group">
                        <button type="button" class="btn btn-outline-primary btn-video-control active" onclick="switchCamera('second')">
                            <i class="fas fa-camera me-1"></i> Камера 1
                        </button>
                        <button type="button" class="btn btn-outline-primary btn-video-control" onclick="switchCamera('third')">
                            <i class="fas fa-camera me-1"></i> Камера 2
                        </button>
                        <button type="button" class="btn btn-outline-primary btn-video-control" onclick="switchCamera('five')">
                            <i class="fas fa-camera me-1"></i> Камера 3
                        </button>
                    </div>
                </div>
                
                <div class="control-section">
                    <div class="panel-title"><i class="fas fa-sliders-h me-1"></i> Управление просмотром</div>
                    <div class="controls-group">
                        <button type="button" class="btn btn-outline-primary btn-video-control" onclick="setStreamSize(300)">
                            <i class="fas fa-mobile-alt me-1"></i> 300
                        </button>
                        <button type="button" class="btn btn-outline-primary btn-video-control" onclick="setStreamSize(440)">
                            <i class="fas fa-tablet-alt me-1"></i> 440
                        </button>
                        <button type="button" class="btn btn-outline-primary btn-video-control active" onclick="setStreamSize(640)">
                            <i class="fas fa-laptop me-1"></i> 640
                        </button>
                        <button type="button" class="btn btn-outline-success btn-video-control" onclick="toggleFullscreen()">
                            <i class="fas fa-expand me-1"></i> Fullscreen
                        </button>
                    </div>
                </div>

                <div class="control-section">
                    <div class="panel-title"><i class="fas fa-record-vinyl me-1"></i> Запись видео</div>
                    <div class="controls-group">
                        <select id="recordDuration" class="form-select me-2" style="width: auto; display: inline-block;">
                            <option value="10">10 секунд</option>
                            <option value="20" selected>20 секунд</option>
                            <option value="30">30 секунд</option>
                            <option value="60">1 минута</option>
                            <option value="120">2 минуты</option>
                        </select>
                        <button type="button" class="btn btn-danger btn-video-control" onclick="startRecording()" id="recordButton">
                            <i class="fas fa-record-vinyl me-1"></i> Начать запись
                        </button>
                        <div id="recordingStatus" class="recording-status" style="display: none;">
                            <i class="fas fa-circle text-danger blink"></i>
                            <span id="statusText">Идет запись...</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="video-container" id="videoContainer" style="max-width: 1100px">
                <iframe id="cameraFrame" src="http://localhost:8889/second" width="100%" height="640" style="border:none;"></iframe>
            </div>
        </div>
    </div>
</body>
</html>
