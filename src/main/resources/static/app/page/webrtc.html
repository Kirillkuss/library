<!doctype html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebRTC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/library/css/menu/index.css">
</head>	
<body>
    <div class="main-content">
        <div class="page-header">
                    <h2><i class="fas fa-file-video"></i> WebRTC</h2>
                    <div id="modalsContainer"></div>
        </div>

         <div class="video-container" id="videoContainer" style="max-width: 800px">
            <video id="video" controls autoplay></video>
          </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    //socket.onopen = () => console.log("Connected!");
    const socket = new WebSocket("ws://localhost:8094/library/video/stream");
    socket.onopen = () => console.log("Connected!");
    const mediaSource = new MediaSource();
    const video = document.getElementById("video");
    let sourceBuffer;
    let bufferQueue = [];
    let isBufferUpdating = false;

    video.src = URL.createObjectURL(mediaSource);

    mediaSource.addEventListener('sourceopen', () => {
      try {
        sourceBuffer = mediaSource.addSourceBuffer('video/mp4; codecs="avc1.42E01E"');
        //const sourceBuffer = mediaSource.addSourceBuffer('video/mp2t; codecs="avc1.42E01E"');
        sourceBuffer.mode = 'sequence';
        sourceBuffer.addEventListener('updateend', processBufferQueue);
        
        console.log("MediaSource ready");
      } catch (e) {
        console.error('MediaSource error:', e);
      }
    });

    socket.onmessage = (event) => {
      if (event.data instanceof Blob) {
        const reader = new FileReader();
        reader.onload = () => {
          addToBufferQueue(new Uint8Array(reader.result));
        };
        reader.readAsArrayBuffer(event.data);
      } else if (event.data instanceof ArrayBuffer) {
        addToBufferQueue(new Uint8Array(event.data));
      }
    };

    function addToBufferQueue(data) {
      bufferQueue.push(data);
      processBufferQueue();
    }

    function processBufferQueue() {
      if (!sourceBuffer || sourceBuffer.updating || bufferQueue.length === 0) {
        return;
      }
      
      try {
        const data = bufferQueue.shift();
        sourceBuffer.appendBuffer(data);
      } catch (e) {
        console.error('AppendBuffer error:', e);
        // Try to recover
        if (mediaSource.readyState === 'open') {
          setTimeout(processBufferQueue, 100);
        }
      }
    }

    socket.onerror = (err) => console.error('WebSocket error:', err);
    socket.onclose = () => console.log('WebSocket closed');

    // Обработка закрытия MediaSource
    mediaSource.addEventListener('sourceended', () => {
      console.log('MediaSource ended');
    });
    mediaSource.addEventListener('sourceclose', () => {
      console.log('MediaSource closed');
    });

    function setVideoSize(width, height = null) {
      const video = document.getElementById('video');
      const videoContainer = document.getElementById('videoContainer');
      
      // Устанавливаем ширину
      video.style.width = width + 'px';
      videoContainer.style.maxWidth = width + 'px';
      
      // Если высота не указана, сохраняем пропорции
      if (height) {
        video.style.height = height + 'px';
      } else {
        video.style.height = 'auto';
      }
    };
    setVideoSize(800);

  </script>
</body>
</html>
