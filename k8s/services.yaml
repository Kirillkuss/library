apiVersion: v1
kind: Service
metadata:
  name: redislib-service
  namespace: library-app
spec:
  selector:
    app: redislib
  ports:
  - port: 6379
    targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: pg-db-service
  namespace: library-app
spec:
  selector:
    app: pg-db
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: library-service
  namespace: library-app
spec:
  type: NodePort
  selector:
    app: library
  ports:
  - port: 8094
    targetPort: 8094
    nodePort: 30094 
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: library-app
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
    nodePort: 30090
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: library-app
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30000
---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter-service
  namespace: library-app
spec:
  selector:
    app: node-exporter
  ports:
  - port: 9100
    targetPort: 9100